    <title>Redesign Product Details Section</title>

        min-height: 0;
        min-width: 0;

      }
      #root {
        min-height: 100%;
        display: block;
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
