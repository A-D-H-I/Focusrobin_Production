# Docker Compose configuration for PostgreSQL on VPS
# Place this file in ~/focusrobin-db/ on your VPS

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: focusrobin_postgres
    restart: always
    environment:
      POSTGRES_USER: focusrobin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_THIS_PASSWORD}
      POSTGRES_DB: focusrobin_prod
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusrobin"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits (adjust based on your VPS specs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
    driver: local













