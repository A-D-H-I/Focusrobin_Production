server {
    listen 80;
    
    # Replace with your domain if needed, or keep _ for default
    server_name _;
    
    # Increase body size limit to allow larger uploads (S3 images)
    # App limit is 10MB, so 20MB covers overhead
    client_max_body_size 20M;
    
    # Timeout settings for large file uploads
    client_body_timeout 300s;
    client_header_timeout 300s;

    location / {
        # Use 'app' service name for docker internal networking
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for large uploads (5 minutes)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
