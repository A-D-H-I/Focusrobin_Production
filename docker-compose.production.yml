version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: focusrobin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SUKa9599@5567
      POSTGRES_DB: focusrobin
    ports:
      - "127.0.0.1:5432:5432"  # Only accessible from localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusrobin-network

  # Next.js Application
  app:
    image: focusrobin/app:latest
    container_name: focusrobin_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:SUKa9599@5567@postgres:5432/focusrobin?schema=public
      # Add other environment variables here or use .env file
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - focusrobin-network
    # Uncomment to mount .env file
    # env_file:
    #   - .env.production

networks:
  focusrobin-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local


